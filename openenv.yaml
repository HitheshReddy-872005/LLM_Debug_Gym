env_id: "llm-debug-gym"
version: "1.0.0"
server_cmd: "python -m server.app"
inference_cmd: "python inference.py"

tasks:
  - id: task_easy
    difficulty: easy
    max_steps: 10
    grader:
      type: "llm"
      prompt_template: "Score 0.0 to 1.0 based on type handling and syntax fix."
  - id: task_medium
    difficulty: medium
    max_steps: 15
    grader:
      type: "llm"
      prompt_template: "Score 0.0 to 1.0 based on unhashable type logic."
  - id: task_hard
    difficulty: hard
    max_steps: 20
    grader:
      type: "llm"
      prompt_template: "Score 0.0 to 1.0 based on recursive dictionary merge logic."
